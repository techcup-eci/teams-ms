name: CI/CD Pipeline
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Compilar y correr tests
        run: mvn clean verify '-Dtest=!ServicioTeamReadbullApplicationTests'
      - name: Análisis SonarCloud
        if: github.ref == 'refs/heads/main'
        run: |
          mvn sonar:sonar \
            -Dsonar.projectKey=wombitocol_teams-ms \
            -Dsonar.organization=wombitocol \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.token=${{ secrets.SONAR_TOKEN }}
      - name: Login en Docker Hub
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build y Push imagen Docker
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: wombito/teams-ms:latest
      - name: Login en Azure
        if: github.ref == 'refs/heads/main'
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Redesplegar en Azure Container Apps
        if: github.ref == 'refs/heads/main'
        run: |
          az containerapp update \
            --name teams-ms \
            --resource-group teams-ms-rg \
            --image docker.io/wombito/teams-ms:latest
