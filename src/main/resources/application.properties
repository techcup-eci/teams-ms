spring.application.name=Servicio-TeamReadbull

# Inter-service: users-and-players-ms (via API Gateway)
user-service.url=${USER_SERVICE_URL:http://localhost:8081}

# Base de datos
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/techcup_teams}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT — solo el Gateway valida JWT. Este microservicio solo lee headers X-User-Id y X-User-Role.
# El secret se mantiene por si se necesita en el futuro, pero NO se usa para validar tokens.
jwt.secret=${JWT_SECRET:TechCupSecretKey2024DefaultOnlyForDev}
jwt.expiration=${JWT_EXPIRATION:900000}

# Otros servicios (via API Gateway)
tournament-service.url=${TOURNAMENT_SERVICE_URL:http://localhost:8081}

# Puerto
server.port=8088

## Api Gateway
gateway.url=${GATEWAY_URL:http://localhost:8081}

